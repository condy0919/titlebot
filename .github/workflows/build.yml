name: Debian 兼容性验证
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: 安装构建依赖
        run: |
          apt-get update
          apt-get install -y ca-certificates git cmake make g++-14 pkg-config libboost-url-dev libuchardet-dev zlib1g-dev libssl-dev
      - uses: actions/checkout@v4
      - name: 构建并运行测试
        env:
          CXX: g++-14
        run: |
          g++-14 --version
          test "$(g++-14 -dumpfullversion)" = 14.2.0
          cmake -S . -B build -DTITLEBOT_ENABLE_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error
